    <h1>InlayAd — AI Advertising Network | AdSense for the AI Era</h1>
    <p>InlayAd is the AI advertising network for AI apps and websites — powered by Probabilistic AI Memory (UMP), MCP Server integration, and dual ad formats. Precision-targeted ads at sub-4ms latency.</p>
    <h2>MCP Server Integration — Drop-In Ad Placement for AI Apps</h2>
    <p>Developers integrate InlayAd via our MCP server in three lines of code. The server reads conversational context and places ads automatically — no custom ad logic required.</p>
    <h2>Dual Ad Formats</h2>
    <p>Traditional banner and poster ads for websites. Dynamic chat card ads for AI interfaces and LLM apps.</p>
    <h2>Probabilistic AI Memory (UMP) Targeting</h2>
    <p>Multi-layered targeting: Cookies → Current Prompt Context → UMP Memory. Our Universal Memory Protocol achieves a 0.82 F1-score for identity linking with zero false positives, 41% context retention improvement, and sub-4ms infrastructure latency. Published research: DOI 10.5281/zenodo.19423177.</p>
